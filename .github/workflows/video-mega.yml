# Rigenera i video dei film modificati e li carica su MEGA in /Velocinema/<film>/.
# - Automatico a ogni push su main che tocca un film (JSON, scene, spartito, voce) o il codice comune.
# - A mano: Actions → "Video su MEGA" → Run workflow (film vuoto = tutti).
# Voce: se su MEGA esiste /Velocinema/<film>/voce/ con le clip (00_copertina, 01_<id>…) o se ci sono
# clip in audio/<film>/, monta anche <film>-voce.mp4.
# Segreti richiesti (Settings → Secrets and variables → Actions): MEGA_EMAIL, MEGA_PASSWORD.
name: Video su MEGA

on:
  push:
    branches: [main]
    paths:
      - films/**
      - quadri/**
      - src/**
      - scripts/**
      - audio/**
      - package.json
      - package-lock.json
      - remotion.config.ts
  workflow_dispatch:
    inputs:
      film:
        description: 'Film da rigenerare, separati da spazi o virgole (es. shutter-island, cast-away). Vuoto = tutti'
        required: false
        default: ''

concurrency:
  group: video-mega
  cancel-in-progress: false

jobs:
  scegli:
    runs-on: ubuntu-24.04
    outputs:
      film: ${{ steps.f.outputs.film }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENTO: ${{ github.event_name }}
          SCELTO: ${{ inputs.film }}
          PRIMA: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = workflow_dispatch ]; then
            if [ -z "$SCELTO" ]; then
              film=$(node scripts/cambiati.mjs --tutti)
            else
              # uno o più film separati da spazi o virgole, es. "cast-away, jurassic-park"
              film=""
              for f in ${SCELTO//,/ }; do
                if [[ "$f" =~ ^[a-z0-9-]+$ ]] && { [ -f "films/$f.json" ] || [ -f "quadri/$f.json" ]; }; then
                  film="$film${film:+,}\"$f\""
                else
                  echo "::error::Film sconosciuto: $f"; exit 1
                fi
              done
              film="[$film]"
            fi
          elif [ -z "$PRIMA" ] || [ "$PRIMA" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$PRIMA" 2>/dev/null; then
            film=$(node scripts/cambiati.mjs --tutti)
          else
            film=$(git diff --name-only "$PRIMA" "$GITHUB_SHA" | node scripts/cambiati.mjs)
          fi
          echo "Film da rigenerare: $film"
          echo "film=$film" >> "$GITHUB_OUTPUT"

  video:
    needs: scegli
    if: needs.scegli.outputs.film != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        film: ${{ fromJSON(needs.scegli.outputs.film) }}
    env:
      FILM: ${{ matrix.film }}
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Strumenti tenuti in cache fra un'esecuzione e l'altra: lo specchio Ubuntu di Azure a volte scarica a pochi KB/s
      # (ffmpeg da apt sono 99 pacchetti). ffmpeg arriva già compilato da GitHub (veloce); i pacchetti di MEGAcmd restano
      # nella cache, così apt li scarica solo la prima volta.
      - uses: actions/cache@v4
        with:
          path: ~/strumenti
          key: strumenti-ubuntu24-v1
      - name: Strumenti (ffmpeg, MEGAcmd)
        timeout-minutes: 15
        run: |
          S=~/strumenti
          mkdir -p "$S/apt/partial"
          if [ ! -x "$S/ffmpeg/bin/ffmpeg" ]; then
            curl -fsSL --retry 3 --max-time 300 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ffmpeg.tar.xz
            mkdir -p "$S/ffmpeg" && tar -xJf /tmp/ffmpeg.tar.xz -C "$S/ffmpeg" --strip-components=1
          fi
          echo "$S/ffmpeg/bin" >> "$GITHUB_PATH"
          "$S/ffmpeg/bin/ffmpeg" -version | head -1
          [ -s "$S/megacmd.deb" ] || wget -q --tries=3 --timeout=60 https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb -O "$S/megacmd.deb"
          installa() {
            sudo timeout 240 apt-get update -q -o Acquire::Retries=3 &&
            sudo timeout 240 apt-get install -y -q -o Acquire::Retries=3 -o Dir::Cache::Archives="$S/apt" "$S/megacmd.deb"
          }
          ok=0
          for i in 1 2 3; do if installa; then ok=1; break; fi; echo "Tentativo $i non riuscito, riprovo"; sleep 10; done
          sudo chown -R "$USER" "$S"
          [ "$ok" = 1 ]
      - run: npm ci
      # campioni (VSCO-2 CE, VCSL) ed effetti registrati: scaricati da scripts/musica.mjs, tenuti fra un'esecuzione e l'altra
      - uses: actions/cache@v4
        with:
          path: campioni
          key: campioni-${{ hashFiles('scripts/audio/vsco.json', 'scripts/audio/effetti.mjs') }}
          restore-keys: campioni-
      - name: Accesso a MEGA
        run: |
          if [ -z "$MEGA_EMAIL" ] || [ -z "$MEGA_PASSWORD" ]; then
            echo "::error::Mancano i segreti MEGA_EMAIL e MEGA_PASSWORD"; exit 1
          fi
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD" > /dev/null
          # mkdir -p dà errore se la cartella c'è già (secondo caricamento dello stesso film): conta solo che alla fine esista
          mega-mkdir -p "/Velocinema/$FILM" > /dev/null 2>&1 || true
          mega-ls "/Velocinema/$FILM" > /dev/null
      # regole vincolanti di CLAUDE.md (durata, ritmo della voce, finale, musica campionata…): se falliscono il video non si fa
      - name: Controlli
        run: node scripts/controlli.mjs "$FILM"
      - name: Video con musica
        run: npm run render -- "$FILM"
      - name: Voce (se ci sono le clip)
        continue-on-error: true
        run: |
          if mega-ls "/Velocinema/$FILM/voce" > /dev/null 2>&1; then
            mkdir -p clip && mega-get "/Velocinema/$FILM/voce" clip/ > /dev/null
            npm run voce -- "$FILM" --cartella clip/voce
          elif [ -n "$(ls -A "audio/$FILM" 2>/dev/null)" ]; then
            npm run voce -- "$FILM"
          else
            echo "Nessuna clip voce per $FILM"
          fi
      - name: Caricamento su MEGA
        run: |
          for f in "out/$FILM.mp4" "out/$FILM-voce.mp4"; do
            [ -f "$f" ] || continue
            dest="/Velocinema/$FILM/$(basename "$f")"
            mega-rm -f "$dest" > /dev/null 2>&1 || true
            mega-put "$f" "$dest" > /dev/null
            echo "Caricato $dest"
          done
      - name: Uscita da MEGA
        if: always()
        run: mega-logout > /dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.film }}
          path: out/${{ matrix.film }}*.mp4
          retention-days: 7
          if-no-files-found: ignore
